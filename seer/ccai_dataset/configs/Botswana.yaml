country: Botswana
base: data/seer/final/epm_open/Botswana  # relative to the seer repo
seed: 0  # every perturbation's seed derives from (seed, run name, index)
significant_figures: 6
cost_dataset: wb_epm  # reference costs for scenario levels: wb_epm (World Bank EPM models) or atb; missing -> the other
noise: 0.02  # relative noise on scenario levels (a run can set its own)

solve:
  model: pyomo
  annualize_capex: false
  years: null  # [first, last] to solve a span of years; null for all

# each run: scenario elements expanded by sweep_mode (grid: every combination; iterate: each element's values
# alone, the others at base), iters perturbations of each scenario, solved if solve (see seer/ccai_dataset/design.py)
runs:
  - name: baseline
    solve: true

  - name: one_at_a_time
    scenario:
      sweep_mode: iterate
      elements:
        dr: [low, high]
        voll: [low, high]
        demand_growth: [low, high]
        demand_profile: [low, high]
        re_profile: [low, high]
        hydro: [low, high]
        capex: [low, high]
        fuel: [low, high]
    solve: true

  - name: capex_x_fuel
    scenario:
      sweep_mode: grid
      elements:
        capex: [base, low, high]
        fuel: [base, low, high]
    solve: true

  - name: cheap_renewables
    scenario:
      elements: {"capex:solar-utility|onwind|battery storage": low, fuel: high}
    solve: true

  - name: fossil_lock_in
    scenario:
      elements: {"capex:solar-utility|onwind|battery storage": high, fuel: low}
    solve: true

  - name: high_demand_poor_resource
    scenario:
      elements: {demand_growth: high, re_profile: low, hydro: low}
    solve: true

  - name: expensive_capital
    scenario:
      elements: {dr: high, capex: high}
    solve: true

  - name: random_solved
    perturbation: {all: 0.5}  # every parameter, up to halfway to its low / high level
    iters: 70
    solve: true

  - name: random_low
    perturbation: {all: 0.25}  # up to a quarter of the way to its low / high level
    iters: 1650
    solve: false

  - name: random_mid
    perturbation: {all: 0.5}
    iters: 1650
    solve: false

  - name: random_high
    perturbation: {all: 1.0}  # anywhere between its low and high level
    iters: 1650
    solve: false
