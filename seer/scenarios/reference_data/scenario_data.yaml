# Scenario parameters' low / mid / high values, keyed by parameter name (see
# seer/scenarios/scenario_parameters.py sample_value):
#
# scenario level low / mid / high: the level's value, times (1 + U(-noise, noise)).
# scenario level random: uniform between the lowest and highest level.
# perturbation p (0-1), applied after the level: uniform around the value, up to p x the distance
#   to the lowest / highest level on each side.
#
# Cost parameters (capex_*, fuel_*) live in technology/tech_cost_starts.csv, tech_cost_pathways.csv
# and fuels/fuel_cost_starts.csv, fuel_cost_pathways.csv; line_capex in network/line_cost_starts.csv,
# line_cost_pathways.csv; hydro in technology/tech_parameters.csv.
#
# Sources (cited by tag below):
# [EPM-doc]   World Bank ESMAP, EPM Input Catalog, pSettings defaults
#             (https://esmap-world-bank-group.github.io/EPM/input/input_detailed/)
# [EPM-data]  World Bank EPM country input files in this repo, data/processed_gams/*/pSettings.csv,
#             pDemandForecast.csv and data/processed_epm_open/*/ (13 + 21 models)
# [IRENA-24]  IRENA, Renewable Power Generation Costs in 2024 (2025)
#             (https://www.irena.org/-/media/Files/IRENA/Agency/Publication/2025/Jul/IRENA_TEC_RPGC_in_2024_2025.pdf)
# [IEA-CoC]   IEA, Cost of Capital Observatory dashboard, utility-scale solar PV, nominal after-tax
#             (https://www.iea.org/reports/cost-of-capital-observatory/dashboard)
# [Fed-2014]  Warusawitharana, "The Social Discount Rate in Developing Countries", FEDS Notes,
#             Federal Reserve Board, 9 Oct 2014
# [Oseni-15]  Oseni & Pollitt, "A firm-level analysis of outage loss differentials and self-generation:
#             Evidence from African business enterprises", Energy Economics 52 (2015) 277-286
# [S&K-15]    Schröder & Kuckshinrichs, "Value of Lost Load: An Efficient Economic Indicator for Power
#             Supply Security? A Literature Review", Frontiers in Energy Research 3:55 (2015)
# [Ember]     Ember, Africa country and region page, accessed 2026-10 (https://ember-energy.org/countries-and-regions/africa)
# [IEA-E25]   IEA, Electricity 2025, Demand chapter (https://www.iea.org/reports/electricity-2025/demand)
# [WB-PV]     World Bank / ESMAP / Solargis, Global Photovoltaic Power Potential by Country (2020)
# [lib]       this repo's profile libraries, profiles/{demand,renewable}/daily_profile_*.csv
#             (built from EPM country profiles)

noise: 0.02  # relative noise on low / mid / high

# real discount rate
# low: concessional / social rate; [Fed-2014] argues ~5% real for developing countries.
# mid: [IRENA-24] Annex I default real after-tax WACC is 7.5% for non-OECD countries from 2020;
#   [EPM-data] uses 6-10% (median 6%, the [EPM-doc] default).
# high: [Fed-2014] says the World Bank and ADB have applied 10-12% real; [IEA-CoC] 2024 EMDE solar
#   is 8.5-13.5% nominal (South Africa 11-13.5%, Brazil 11.5-12.5%, India 10-11.5%).
dr: {low: 0.04, mid: 0.08, high: 0.12}

# $/MWh
# low: [EPM-data] Gambia 500, Guinea 300 (below every survey estimate, but EPM practice for poor systems).
# mid: [EPM-doc] default is 1000; [EPM-data] Mexico 1500, Serbia 2000, Eswatini 3000.
# high: [EPM-data] Türkiye and Timor-Leste 10000. This is the low end of empirical estimates:
#   [Oseni-15] 1500-32000 $/MWh for African firms; [S&K-15] household VoLL is typically 10-25 €/kWh.
voll: {low: 500, mid: 2500, high: 10000}

# annual peak growth
# [EPM-data] 15-year peak CAGR across 33 models: median 4.9%, interquartile range 2.6-6.6%, 90th percentile 9%.
# low: [Ember] Africa demand +3.2% (2025), +3.7% (2024), world +2.8%; [EPM-data] 25th percentile 2.6%.
# mid: [EPM-data] median; [IEA-E25] India 6.3%/yr and world 3.9%/yr for 2025-27; the IEA's ~5%/yr for
#   Africa (2025-27) is reported only second-hand, in Engineering News and Ecofin.
# high: [EPM-data] 75th percentile 6.6%, plus fast-electrifying SSA systems (Guinea 9%, Sierra Leone 12%).
demand_growth: {low: 0.02, mid: 0.045, high: 0.07}

# daily load factor (mean / max): low / mid / high is how peaky each day is, so high = lowest load factor
# [lib] 1136 days: median 0.81, 5th-95th percentile 0.76-0.95, minimum 0.62.
# Own calculation on [EPM-data] pDemandProfile across 102 zones: median 0.84, 5th-95th percentile
#   0.72-0.91, minimum 0.66 (Eswatini; Kenya 0.76, Nigeria 0.93).
# No published table of daily load factors was found.
demand_profile:
  low: 0.90  # [EPM-data] 95th percentile 0.91, Nigeria 0.93
  mid: 0.82  # [lib] median 0.81; [EPM-data] median 0.84
  high: 0.70  # [EPM-data] 5th percentile 0.72, minimum 0.66
  peak_hour: 19  # create's starting peak hour; [lib] median peak hour is 19-21 for the African countries
  peak_hour_shift: 4.0  # hours, either direction, at perturbation 1 (wraps at 24)
  shapes:  # also accepted as demand_profile levels
    flat: {load_factor: 0.90, peak_hour: 19}
    peaky: {load_factor: 0.70, peak_hour: 19}
    morning-peak: {load_factor: 0.82, peak_hour: 9}

# annual capacity factor, keyed by category
re_profile:
  # [IRENA-24] Table 3.2: 2024 global weighted average 17.4%, 5th-95th percentile 11.5-22.6%.
  # [WB-PV] PVOUT 3.5-5.0 kWh/kWp/day (fixed tilt, DC) is ~15-21%; SSA and MENA are mostly >4.5 (>19%).
  # [lib] 91 profiles: median 0.20, 5th-95th percentile 0.15-0.26.
  # high: above the IRENA 95th percentile; it reflects tracking or a high DC/AC ratio, as in [lib].
  solar: {low: 0.15, mid: 0.20, high: 0.25}
  # [IRENA-24] onshore 2024: global weighted average 34%, 5th-95th percentile 24-56%;
  #   Table 2.3 Africa 41 / 44 / 47% (5th / average / 95th, few projects); Eurasia 28 / 34 / 37%.
  # [lib] 22 profiles: median 0.25, range 0.05-0.51.
  wind: {low: 0.25, mid: 0.32, high: 0.40}
