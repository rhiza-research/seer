[project]
name = "seer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "numpy",
    "matplotlib",
    "pypsa",
    "jupyterlab",
    "pyomo",
    "coiled",
    "fsspec",
    "gcsfs",
    "torch",
    "gamspy>=1.26.4",
    "gridflow",
    "pyyaml>=6.0.3",
    "xarray<2026",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["seer", "inputs/gdx", "inputs/epm2seer"]

[tool.uv.sources]
gridflow = { git = "https://github.com/ESMAP-World-Bank-Group/gridflow.git", rev = "network-zoning-method" }

[dependency-groups]
dev = [
    "openpyxl>=3.1.5",
]
